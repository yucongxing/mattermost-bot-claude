[project]
name = "mattermost-agent-gateway"
version = "0.1.0"
description = "Minimal Mattermost @mention gateway for Codex, Claude Code, and a local OpenAI-compatible LLM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "websockets>=15,<17",
  "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
